general:
  input_list: protein-peptide-input-unbound.txt
  work_dir: benchmark_output/uu-ti-act-pass

  execution: slurm
  partition: short
  gen_archive: true
  ncores: 40
  max_concurrent: 10

  # peptide ligand is a multi-model file named <id>_l_u.pdb
  # haddock3 detects the MODEL records and treats it as an ensemble itself
  mol_suffixes:
    - _r_u
    - _l_u

scenarios:
  - name: uu-ti-act-pass
    workflow:
        topoaa:
          clean: true

        rigidbody:
          sampling: 3000
          ambig_fname: _u_ambig.tbl

        caprieval.1:
          reference_fname: _target.pdb

        seletop:
          select: 200

        caprieval.2:
          reference_fname: _target.pdb

        flexref:
          ambig_fname: _u_ambig.tbl
          tolerance: 75

        caprieval.3:
          reference_fname: _target.pdb

        emref:
          ambig_fname: _u_ambig.tbl

        caprieval.4:
          reference_fname: _target.pdb

        clustfcc:

        seletopclusts:
          top_models: 10

        caprieval.5:
          reference_fname: _target.pdb
